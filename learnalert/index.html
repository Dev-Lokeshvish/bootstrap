<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Alert component</title>
    <!-- bootstrap link  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- link css  -->
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
         <!-- alert message  -->
           <div class="alert alert-primary" role="alert">
             primary alert
           </div>

           <div class="alert alert-secondary" role="alert">
            secondary alert
           </div>

           <div class="alert alert-dark" role="alert">
            dark alert
           </div>

           <!-- alert with ancur tag -->
            <div class="alert alert-success">
            Success! Your account has been created successfully.
            You can now <a href="#" class="alert-link">Login here</a> to access your dashboard.
            </div>

            <div class="alert alert-danger">
            Error! Your session has expired.
            Please <a href="#" class="alert-link">click here</a> to login again.
            </div>

            <div class="alert alert-warning">
             Warning! Your account security is at risk. Please <a href="#" class="alert-link">update your password</a> immediately.

            </div>
    </div>
</body>
</html>
